artin/system-design-primer/blob/master/solutions/system_design/pastebin/README.md","note":"Reference solution. Read after your attempt."}],"status":"todo","proof":null,"doneAt":null,"spentMin":null},{"id":"d1024-2","date":"2026-10-24","dayLabel":"Mock 1","topic":"Mock interview: URL shortener","order":2,"kind":"recall","title":"Self-review against the reference","minutes":10,"why":"","feeds":"","steps":["Compare your design with the reference solution.","Write the 3 biggest gaps and one thing you did well."],"resources":[],"status":"todo","proof":null,"doneAt":null,"spentMin":null},{"id":"d1025-1","date":"2026-10-25","dayLabel":"Catch-up","topic":"Buffer day","order":1,"kind":"recall","title":"Catch up, then a 10-minute recall","minutes":10,"why":"Buffer day. Carried-over quests first, then rest.","feeds":"","steps":["Finish anything carried over.","From memory: draw the Doc 1 architecture in 5 minutes."],"resources":[],"status":"todo","proof":null,"doneAt":null,"spentMin":null},{"id":"d1026-1","date":"2026-10-26","dayLabel":"Bonus 2","topic":"Payments and idempotency","order":1,"kind":"watch","title":"Learn how real payment systems avoid double charges","minutes":25,"why":"Money flows are where idempotency, sagas and reconciliation stop being theory.","feeds":"Doc 1 (Bank reconciliation) · §8 Failure modes","steps":["Read the Airbnb post on avoiding double payments.","Re-read the Stripe idempotency post with fresh eyes.","Skim the saga pattern page."],"resources":[{"label":"Airbnb: Avoiding double payments in a distributed payments system","url":"https://medium.com/airbnb-engineering/avoiding-double-payments-in-a-distributed-payments-system-2981f6b070bb","note":"Read. Idempotency in production, with failure stories."},{"label":"Stripe: Designing robust APIs with idempotency","url":"https://stripe.com/blog/idempotency","note":"Re-read. Notice how often retries happen."},{"label":"microservices.io: Saga pattern","url":"https://microservices.io/patterns/data/saga.html
